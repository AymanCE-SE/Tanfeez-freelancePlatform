services:
  - type: web
    name: tanfeez-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_NAME
        fromDatabase:
          name: tanfeez-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: tanfeez-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: tanfeez-db
          property: password
      - key: DATABASE_HOSTNAME
        fromDatabase:
          name: tanfeez-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: tanfeez-db
          property: port

databases:
  - name: tanfeez-db
    plan: free